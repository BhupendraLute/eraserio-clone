name: CI

# Run on every push to any branch and every pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel in-progress runs when a newer commit lands on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck · Lint · Tests · Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No `cache: npm` — the repo has no package-lock.json, and
          # setup-node's npm cache requires one.

      - name: Install dependencies
        # `npm install` (not `npm ci`) because there is no lockfile.
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Coverage (enforces 70/60/75/75 thresholds)
        run: npm run test:coverage

      # Upload even on failure so a threshold regression is easy to inspect.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
